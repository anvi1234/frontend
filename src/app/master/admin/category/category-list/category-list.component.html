 <div class="product-list-wrapper">
     <div class="row">
    <div class="col-sm-10">
  <h2>Category List</h2>
    </div>
    <div class="col-sm-2">
 <button class="add-btn" (click)="navigate()">+ Add Catergory</button>
    </div>

  
   
  </div>
  <br>
 
   <table class="product-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Slug</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let cat of categories; let i = index">
          <td>{{ cat.name }}</td>
          <td>{{ cat.slug }}</td>
          <td>
            <span [class.active]="cat.isActive" [class.inactive]="!cat.isActive">
              {{ cat.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td class="actions">
            <i class="icon edit" (click)="editCategory(cat._id)">✏️</i> &nbsp;&nbsp;&nbsp;
            <i class="icon delete" (click)="deleteCategory(cat._id)">🗑️</i>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
