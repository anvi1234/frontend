 <div class="product-list-wrapper">
     <div class="row">
    <div class="col-sm-10">
  <h2>Banner List</h2>
    </div>
    <div class="col-sm-2">
 <button class="add-btn" (click)="navigate()">+ Add Banner</button>
    </div>

  
   
  </div>
  <br>
 
   <table class="product-table">
      <thead>
        <tr>
          <th>Banner</th>
           <th>Alt Tag</th>
          <th>Positon</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let cat of bannerData; let i = index">
          <td>  <img
            [src]="cat.image.url"
            class="product-img"
          /></td>
          <td>{{ cat.altTag }}</td>
           <td>{{ cat.position }}</td>
          <td class="actions">
            <i class="icon delete" (click)="deleteBanner(cat._id)">🗑️</i>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
